apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-dashboard
  namespace: pipeline-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: pipeline-demo
data:
  demo-app.json: |
    {
      "title": "Demo App",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "App Up",
          "targets": [{ "expr": "demo_app_up", "legendFormat": "up" }],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Uptime Seconds",
          "targets": [{ "expr": "demo_app_uptime_seconds", "legendFormat": "uptime" }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 }
        }
      ]
    }
