# Strict config for negative tests — no allowlist for fixtures
title = "pipeline gitleaks strict"

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_\-]?key|secret|token|password)\s*[:=]\s*['\"]?[A-Za-z0-9/\+]{16,}['\"]?'''

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----'''
