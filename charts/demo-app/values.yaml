replicaCount: 1

image:
  repository: localhost:5001/demo-app
  # ALWAYS pin by digest in real environments
  digest: ""
  tag: "" # forbidden in prod overlays; chart template prefers digest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: demo-app

serviceAccount:
  create: true
  name: demo-app
  automount: false

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

env:
  APP_NAME: demo-app
  PORT: "8080"
