name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  HELM_VERSION: "v3.16.2"

jobs:
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml
          pip install -r examples/demo-app/requirements.txt
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Ruff
        run: ruff check examples/demo-app

      - name: Helm lint
        run: helm lint charts/demo-app

      - name: Unit tests
        run: |
          cd examples/demo-app
          pytest -q

      - name: Manifest smoke
        run: bash tests/smoke/test_scripts_exist.sh

      - name: Shell syntax
        run: |
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find scripts -name '*.sh' -print0)

      - name: GitOps digest-update preserves env-patch
        run: |
          bash tests/integration/test_gitops_digest.sh

      - name: Gitleaks
        run: gitleaks detect --source . --config security/scanning/gitleaks.toml

  security:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Partial StrategicMergePatch YAMLs are not full Deployments — do not misconfig-scan them.
      - name: Trivy FS (vuln + secret, whole repo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          scanners: vuln,secret
          skip-dirs: tests/negative,.git,.venv,reports,.demo-state,.cosign
          trivyignores: security/scanning/.trivyignore

      - name: Trivy config (rendered GitOps + platform + charts)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: tests/negative,.git,.venv,reports,.demo-state,.cosign,gitops/dev,gitops/qa,gitops/performance,gitops/production,tekton
          # Still scans gitops/base, platform/, charts/, examples/

      - name: Trivy config on kustomize-rendered overlays
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          mkdir -p /tmp/rendered
          for env in dev qa performance production; do
            kubectl kustomize "gitops/${env}" > "/tmp/rendered/${env}.yaml"
          done
          trivy config --exit-code 1 --severity HIGH,CRITICAL /tmp/rendered

      - name: Negative tests (subset)
        env:
          GITLEAKS_VERSION: "8.30.1"
          HELM_VERSION: "v3.16.2"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          if gitleaks detect --source tests/negative/leaked-secret --no-git --config tests/negative/gitleaks-strict.toml; then
            echo "expected gitleaks to fail"; exit 1
          fi
          if helm template demo charts/demo-app -f tests/negative/bad-helm/values.bad.yaml; then
            echo "expected helm template to fail"; exit 1
          fi
          echo "✓ negative fixtures blocked"
