apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: secure-ci
  namespace: pipeline-ci
  labels:
    app.kubernetes.io/part-of: pipeline-demo
    app.kubernetes.io/version: "1.1.0"
  annotations:
    description: "Optional clone → secrets → SCA → tests → manifests → IaC → optional SBOM/verify"
spec:
  description: CI security and quality gates (CD is GitOps)
  params:
    - name: image
      type: string
      description: Image reference (tag or digest) for SBOM/verify when digest-pinned
    - name: source-subdir
      type: string
      default: "examples/demo-app"
      description: App subdir for unit tests / app SCA
    - name: git-url
      type: string
      default: ""
      description: If set, clone this repo into the source workspace first
    - name: git-revision
      type: string
      default: main
    - name: verify-signature
      type: string
      default: "false"
      description: Set true to run cosign-verify (requires cosign-pub ConfigMap)
  workspaces:
    - name: source
    - name: reports
  results:
    - name: status
      description: Pipeline completion status
      value: $(tasks.report.results.summary)
  tasks:
    - name: clone
      retries: 1
      timeout: "10m"
      when:
        - input: "$(params.git-url)"
          operator: notin
          values: [""]
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: "$(params.git-url)"
        - name: revision
          value: "$(params.git-revision)"

    - name: gitleaks
      retries: 1
      timeout: "10m"
      runAfter: ["clone"]
      taskRef:
        name: gitleaks
      workspaces:
        - name: source
          workspace: source
        - name: reports
          workspace: reports
      params:
        # Empty = whole workspace (fail closed on any leaked secret)
        - name: source-subdir
          value: ""

    - name: sca
      retries: 1
      timeout: "15m"
      runAfter: ["gitleaks"]
      taskRef:
        name: sca-trivy
      workspaces:
        - name: source
          workspace: source
        - name: reports
          workspace: reports
      params:
        - name: source-subdir
          value: "$(params.source-subdir)"

    - name: unit-test
      retries: 1
      timeout: "10m"
      runAfter: ["gitleaks"]
      taskRef:
        name: unit-test-python
      workspaces:
        - name: source
          workspace: source
        - name: reports
          workspace: reports
      params:
        - name: source-subdir
          value: "$(params.source-subdir)"

    - name: manifests
      retries: 1
      timeout: "10m"
      runAfter: ["gitleaks"]
      taskRef:
        name: helm-kubeconform
      workspaces:
        - name: source
          workspace: source

    - name: iac-scan
      retries: 1
      timeout: "10m"
      runAfter: ["manifests"]
      taskRef:
        name: iac-checkov
      workspaces:
        - name: source
          workspace: source
        - name: reports
          workspace: reports

    - name: sbom
      retries: 1
      timeout: "10m"
      runAfter: ["sca"]
      when:
        - input: "$(params.image)"
          operator: notin
          values: [""]
      taskRef:
        name: sbom-syft
      workspaces:
        - name: reports
          workspace: reports
      params:
        - name: image
          value: "$(params.image)"

    - name: verify
      retries: 1
      timeout: "10m"
      runAfter: ["sbom"]
      when:
        - input: "$(params.verify-signature)"
          operator: in
          values: ["true", "True", "1"]
      taskRef:
        name: cosign-verify
      params:
        - name: image
          value: "$(params.image)"

    - name: report
      runAfter: ["unit-test", "iac-scan", "sbom", "verify"]
      taskRef:
        name: report-results
      workspaces:
        - name: reports
          workspace: reports

  finally:
    - name: cleanup-note
      taskSpec:
        steps:
          - name: echo
            image: busybox:1.36
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            computeResources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 32Mi
            script: |
              #!/bin/sh
              echo "Pipeline finished. Reports retained in workspace for collectors."
